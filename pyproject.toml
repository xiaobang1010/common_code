[project]
name = "common-code-py"
version = "0.1.0"
description = "Python reimplementation of Common Code CLI AI programming assistant"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
common-code-py = "startup.entrypoints.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ink", "query", "startup", "tools"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
